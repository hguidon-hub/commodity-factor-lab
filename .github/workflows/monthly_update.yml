name: Monthly data & model update

on:
  schedule:
    - cron: "0 6 3 * *"      # 3rd of every month, 06:00 UTC (month-end data + COT release available)
  workflow_dispatch: {}      # manual "Run workflow" button
  push:                      # re-run the models when the code changes (bot commits only touch data/)
    branches: [main]
    paths: ["src/**", "scripts/**", "requirements.txt", ".github/workflows/**"]

concurrency:                 # one update at a time: parallel runs would race to push results
  group: monthly-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (synthetic data)
        run: pytest -q
      - name: Run pipeline on live data
        run: python scripts/run_pipeline.py --source yahoo
      - name: Commit results (Posit Connect Cloud republishes on push)
        run: |
          git config user.name  "cfl-bot"
          git config user.email "cfl-bot@users.noreply.github.com"
          git add data/results
          git diff --cached --quiet || git commit -m "Monthly update $(date -u +%Y-%m-%d)"
          # GitHub occasionally answers a push with a 5xx: retry, rebasing on anything pushed meanwhile
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push failed (attempt $i), retrying in $((i * 20))s"; sleep $((i * 20))
          done
          exit 1
